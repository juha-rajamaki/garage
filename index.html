<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Planner</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- Toolbar -->
  <header id="toolbar">
    <div class="toolbar-left">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="3" width="15" height="13" rx="1"/>
        <path d="M16 8h4l3 5v3h-7V8z"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      <span class="app-title">Garage Planner</span>
    </div>
    <div class="toolbar-right">
      <button id="btn-reset" class="btn btn-ghost">Tyhjennä talli</button>
    </div>
  </header>

  <!-- Main layout -->
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar">
      <h2 class="sidebar-title">Autot</h2>
      <p class="sidebar-hint">Klikkaa lisätäksesi tai poistaaksesi auton tallista</p>

      <div class="library-grid">

        <div class="lib-car" data-key="bmw">
          <div class="lib-car-img">
            <img src="car-bmw.png" alt="BMW Z4 35is" />
          </div>
          <span class="lib-car-name">BMW Z4 35is</span>
        </div>

        <div class="lib-car" data-key="porsche">
          <div class="lib-car-img lib-car-3d">
            <model-viewer
              src="porsche.glb"
              alt="Porsche Panamera E-Hybrid"
              auto-rotate
              rotation-per-second="20deg"
              camera-orbit="0deg 75deg 3.5m"
              disable-zoom
              interaction-prompt="none"
              style="width:100%;height:100%;background:transparent;"
            ></model-viewer>
            <div class="badge-3d">3D</div>
          </div>
          <span class="lib-car-name">Porsche Panamera <span class="name-hint">— klikkaa 3D</span></span>
        </div>

        <div class="lib-car" data-key="jeep">
          <div class="lib-car-img">
            <img src="car-jeep.png" alt="Jeep Wrangler Rubicon" />
          </div>
          <span class="lib-car-name">Jeep Rubicon</span>
        </div>

      </div>
    </aside>

    <!-- Board: garage image background -->
    <main id="board">
      <!-- Car images injected by JS -->
    </main>

  </div>

  <!-- 3D viewer modal -->
  <div id="viewer-overlay" class="hidden">
    <div id="viewer-modal">
      <div id="viewer-header">
        <span id="viewer-title">Porsche Panamera E-Hybrid</span>
        <button id="viewer-close">&times;</button>
      </div>
      <model-viewer
        id="viewer-3d"
        src="porsche.glb"
        alt="Porsche Panamera E-Hybrid"
        auto-rotate
        camera-controls
        shadow-intensity="1"
        environment-image="neutral"
        style="width:100%;height:100%;background:#0a0a0f;"
      ></model-viewer>
      <div id="viewer-hint">Pyöritä hiirellä · Zoomaa rullalla · Lisää talliin napilla</div>
      <button id="viewer-add" class="btn btn-primary">Lisää talliin</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

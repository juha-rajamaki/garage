<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toolbar -->
  <header id="toolbar">
    <div class="toolbar-left">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="3" width="15" height="13" rx="1"/>
        <path d="M16 8h4l3 5v3h-7V8z"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      <span class="app-title">Garage Planner</span>
    </div>
    <div class="toolbar-right">
      <button id="btn-reset" class="btn btn-ghost">Reset Board</button>
      <button id="btn-save" class="btn btn-primary">Save Layout</button>
    </div>
  </header>

  <!-- Main layout -->
  <div id="app">

    <!-- Sidebar: car library -->
    <aside id="sidebar">
      <h2 class="sidebar-title">Car Library</h2>
      <p class="sidebar-hint">Click a car to add it to the garage</p>

      <div class="library-section">
        <h3 class="section-label">Sports</h3>
        <div class="library-grid">
          <div class="lib-car" data-make="Ferrari" data-model="488 GTB" data-category="sports">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#c0392b" opacity="0.3"/>
                <path d="M8 20 Q12 10 22 8 Q30 5 40 5 Q52 5 62 9 Q70 12 72 20 Z" fill="#c0392b"/>
                <path d="M20 20 Q22 12 30 10 Q38 8 48 10 Q56 12 58 20" fill="#e74c3c"/>
                <rect x="14" y="18" width="52" height="5" rx="2" fill="#922b21"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="62" y="14" width="8" height="4" rx="1" fill="#f39c12" opacity="0.8"/>
              </svg>
            </div>
            <span class="lib-car-name">Ferrari 488</span>
          </div>
          <div class="lib-car" data-make="Lamborghini" data-model="Huracán" data-category="sports">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#f39c12" opacity="0.3"/>
                <path d="M6 20 L16 8 L28 5 L52 5 L66 10 L74 20 Z" fill="#f39c12"/>
                <path d="M18 20 L24 10 L36 8 L50 9 L60 14 L62 20" fill="#f1c40f"/>
                <rect x="12" y="18" width="56" height="5" rx="1" fill="#d68910"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="64" y="13" width="7" height="3" rx="1" fill="#f39c12" opacity="0.9"/>
              </svg>
            </div>
            <span class="lib-car-name">Lamborghini</span>
          </div>
          <div class="lib-car" data-make="McLaren" data-model="720S" data-category="sports">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#e67e22" opacity="0.3"/>
                <path d="M10 20 Q14 9 26 7 Q38 4 50 6 Q62 8 70 20 Z" fill="#e67e22"/>
                <path d="M22 20 Q26 11 36 9 Q44 7 54 10 Q60 13 62 20" fill="#f39c12"/>
                <rect x="14" y="18" width="52" height="5" rx="2" fill="#ca6f1e"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="63" y="13" width="7" height="4" rx="1" fill="#e67e22" opacity="0.9"/>
              </svg>
            </div>
            <span class="lib-car-name">McLaren 720S</span>
          </div>
        </div>
      </div>

      <div class="library-section">
        <h3 class="section-label">Sedan</h3>

          <div class="lib-car" data-make="BMW" data-model="M5" data-category="sedan">

                <path d="M8 20 Q10 12 20 9 Q30 6 40 6 Q52 6 62 10 Q70 13 72 20 Z" fill="#2980b9"/>
                <path d="M18 20 Q20 12 30 10 Q40 8 50 10 Q58 12 60 20" fill="#3498db"/>
                <rect x="12" y="18" width="56" height="5" rx="2" fill="#1a6f9f"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="62" y="14" width="8" height="4" rx="1" fill="#f39c12" opacity="0.8"/>

            <span class="lib-car-name">BMW M5</span>
          </div>

                <path d="M8 20 Q10 12 22 9 Q32 6 42 6 Q54 6 64 10 Q70 13 72 20 Z" fill="#95a5a6"/>
                <path d="M18 20 Q22 12 32 10 Q42 8 52 10 Q60 13 62 20" fill="#bdc3c7"/>
                <rect x="12" y="18" width="56" height="5" rx="2" fill="#7f8c8d"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>

            <span class="lib-car-name">Mercedes E63</span>
          </div>
          <div class="lib-car" data-make="Audi" data-model="RS7" data-category="sedan">

              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">

                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="62" y="14" width="8" height="4" rx="1" fill="#f39c12" opacity="0.8"/>
              </svg>
            </div>
            <span class="lib-car-name">Audi RS7</span>
          </div>
        </div>
      </div>

      <div class="library-section">
        <h3 class="section-label">SUV</h3>
        <div class="library-grid">
          <div class="lib-car" data-make="Range Rover" data-model="Sport SVR" data-category="suv">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="25" rx="36" ry="6" fill="#27ae60" opacity="0.3"/>
                <rect x="10" y="8" width="60" height="16" rx="2" fill="#27ae60"/>
                <rect x="14" y="5" width="52" height="14" rx="2" fill="#2ecc71"/>
                <rect x="16" y="7" width="22" height="9" rx="1" fill="#1a3a2a" opacity="0.7"/>
                <rect x="42" y="7" width="22" height="9" rx="1" fill="#1a3a2a" opacity="0.7"/>
                <rect x="10" y="22" width="60" height="4" rx="1" fill="#1e8449"/>
                <circle cx="20" cy="26" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
                <circle cx="20" cy="26" r="2.5" fill="#333"/>
                <circle cx="60" cy="26" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
                <circle cx="60" cy="26" r="2.5" fill="#333"/>
                <rect x="64" y="14" width="8" height="5" rx="1" fill="#f39c12" opacity="0.8"/>
              </svg>
            </div>
            <span class="lib-car-name">Range Rover</span>
          </div>
          <div class="lib-car" data-make="Cadillac" data-model="Escalade" data-category="suv">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="25" rx="36" ry="6" fill="#1a1a2e" opacity="0.4"/>
                <rect x="8" y="8" width="64" height="16" rx="1" fill="#2c3e50"/>
                <rect x="12" y="5" width="56" height="14" rx="1" fill="#34495e"/>
                <rect x="14" y="7" width="24" height="9" rx="1" fill="#1a2634" opacity="0.8"/>
                <rect x="42" y="7" width="24" height="9" rx="1" fill="#1a2634" opacity="0.8"/>
                <rect x="8" y="22" width="64" height="4" rx="1" fill="#1c2833"/>
                <circle cx="20" cy="26" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
                <circle cx="20" cy="26" r="2.5" fill="#333"/>
                <circle cx="60" cy="26" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
                <circle cx="60" cy="26" r="2.5" fill="#333"/>
                <rect x="64" y="14" width="8" height="5" rx="1" fill="#f39c12" opacity="0.8"/>
              </svg>
            </div>
            <span class="lib-car-name">Escalade</span>
          </div>
        </div>
      </div>

      <div class="library-section">
        <h3 class="section-label">Convertible</h3>
        <div class="library-grid">
          <div class="lib-car" data-make="Porsche" data-model="911 Cabriolet" data-category="convertible">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#8e44ad" opacity="0.3"/>
                <path d="M8 20 Q10 14 20 12 Q30 9 40 9 Q52 10 62 13 Q70 16 72 20 Z" fill="#8e44ad"/>
                <path d="M22 20 Q25 13 34 11 Q42 9 52 12 Q58 14 60 20" fill="#9b59b6" opacity="0.7"/>
                <rect x="12" y="18" width="56" height="5" rx="2" fill="#6c3483"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="62" y="14" width="8" height="4" rx="1" fill="#f39c12" opacity="0.8"/>
              </svg>
            </div>
            <span class="lib-car-name">Porsche 911</span>
          </div>
        </div>
      </div>

      <div class="library-section">
        <h3 class="section-label">Electric</h3>
        <div class="library-grid">
          <div class="lib-car" data-make="Tesla" data-model="Model S Plaid" data-category="electric">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#1abc9c" opacity="0.3"/>
                <path d="M8 20 Q10 12 22 9 Q32 6 42 6 Q54 6 63 10 Q70 13 72 20 Z" fill="#1abc9c"/>
                <path d="M18 20 Q22 12 32 10 Q42 8 52 10 Q60 12 62 20" fill="#16a085"/>
                <rect x="12" y="18" width="56" height="5" rx="2" fill="#148f77"/>
                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="62" y="14" width="8" height="4" rx="1" fill="#1abc9c" opacity="0.9"/>
                <text x="34" y="16" font-size="6" fill="white" font-weight="bold">⚡</text>
              </svg>
            </div>
            <span class="lib-car-name">Tesla Model S</span>
          </div>
          <div class="lib-car" data-make="Rimac" data-model="Nevera" data-category="electric">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#8e44ad" opacity="0.25"/>
                <path d="M8 20 Q12 9 24 7 Q36 4 46 5 Q60 6 68 14 Q72 17 72 20 Z" fill="#6c3483"/>
                <path d="M20 20 Q24 11 34 9 Q44 7 54 9 Q62 13 64 20" fill="#8e44ad"/>

                <circle cx="20" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="20" cy="23" r="2" fill="#333"/>
                <circle cx="60" cy="23" r="4" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="60" cy="23" r="2" fill="#333"/>
                <rect x="64" y="13" width="7" height="4" rx="1" fill="#8e44ad" opacity="0.9"/>

      <div class="library-section">
        <h3 class="section-label">Classic</h3>
        <div class="library-grid">
          <div class="lib-car" data-make="Ford" data-model="Mustang GT500" data-category="classic">
            <div class="lib-car-icon">
              <svg viewBox="0 0 80 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="22" rx="36" ry="6" fill="#c0392b" opacity="0.3"/>
                <path d="M6 20 Q8 12 18 9 Q28 6 40 6 Q52 6 62 9 Q70 12 74 20 Z" fill="#c0392b"/>
                <path d="M16 20 Q18 11 28 9 Q38 7 50 9 Q58 12 60 20" fill="#e74c3c"/>
                <path d="M40 6 L44 11 L36 11 Z" fill="#e74c3c"/>
                <rect x="10" y="18" width="60" height="5" rx="2" fill="#922b21"/>
                <circle cx="18" cy="23" r="4.5" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="18" cy="23" r="2.5" fill="#333"/>
                <circle cx="62" cy="23" r="4.5" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
                <circle cx="62" cy="23" r="2.5" fill="#333"/>
                <rect x="64" y="13" width="8" height="4" rx="1" fill="#f39c12" opacity="0.8"/>
              </svg>
            </div>
            <span class="lib-car-name">Mustang GT500</span>
          </div>
        </div>
      </div>

    </aside>

    <!-- Board: garage image background -->
    <main id="board">
      <!-- Car cards injected here by JS -->
    </main>

  </div>

  <!-- Edit Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close" class="modal-close-btn">&times;</button>
      <h2 class="modal-title">Edit Car Details</h2>
      <div class="modal-car-preview" id="modal-car-icon"></div>

      <div class="form-group">
        <label>Make &amp; Model</label>
        <input type="text" id="field-make-model" placeholder="e.g. BMW Z4 35is" />
      </div>
      <div class="form-group">
        <label>Owner Name</label>
        <input type="text" id="field-owner" placeholder="e.g. John Doe" />
      </div>
      <div class="form-group">
        <label>Parking Spot</label>
        <input type="text" id="field-spot" placeholder="e.g. A1" maxlength="4" />
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="field-notes" rows="3" placeholder="e.g. Track day prep, tires to swap..."></textarea>
      </div>
      <div class="modal-actions">
        <button id="modal-delete" class="btn btn-danger">Remove Car</button>
        <button id="modal-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
